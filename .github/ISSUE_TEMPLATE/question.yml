name: Question
description: Ask about the simulation, the model behind it, or how to build and run it.
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What you've tried or read so far, and what you're trying to do.
