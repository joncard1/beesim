# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'sbt'
    - uses: sbt/setup-sbt@v1
    - name: Run tests with coverage
      # Coverage is reported, not enforced: low coverage doesn't fail the build.
      run: sbt "coverage ; test ; coverageReport ; shutdown"
    - name: Summarize coverage
      if: always()
      run: |
        # sbt 1 writes to target/scala-<version>/, sbt 2 to target/out/jvm/.../
        report=$(find target -path "*/scoverage-report/scoverage.xml" | head -1)
        if [ -n "$report" ]; then
          statements=$(grep -o 'statement-rate="[^"]*"' "$report" | head -1 | cut -d'"' -f2)
          branches=$(grep -o 'branch-rate="[^"]*"' "$report" | head -1 | cut -d'"' -f2)
          {
            echo "### Code coverage"
            echo ""
            echo "| Statements | Branches |"
            echo "|---|---|"
            echo "| ${statements}% | ${branches}% |"
            echo ""
            echo "The full HTML report is attached to this run as the \`coverage-report\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: target/**/scoverage-report/
        if-no-files-found: ignore
      # Optional: This step uploads information to the GitHub dependency graph and unblocking Dependabot alerts for the repository
    - name: Upload dependency graph
      uses: scalacenter/sbt-dependency-submission@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Check formatting
      # Run `sbt scalafmtAll` to fix any formatting this reports.
      run: sbt "scalafmtCheckAll ; scalafmtSbtCheck ; shutdown"
